services:
  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
