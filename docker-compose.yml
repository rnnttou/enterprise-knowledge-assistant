services:
  api:
    build:
      context: .
      args:
        # true = read scanned PDFs and images (Step 11); bigger image
        WITH_OCR: ${WITH_OCR:-false}
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Host port 8088 (not 8000): Windows/WSL reserves ranges of ports for
      # Hyper-V's dynamic port allocation, and 8000 commonly falls inside one,
      # causing "bind: An attempt was made to access a socket in a way
      # forbidden..." Check yours with:
      #   netsh interface ipv4 show excludedportrange protocol=tcp
      - "8088:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      # Layout (DocLayout-YOLO) and OCR (EasyOCR) weights, downloaded once
      - model_cache:/root/.cache
      - easyocr_models:/root/.EasyOCR

  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  model_cache:
  easyocr_models:
